# Render Blueprint: API + Postgres + Key Value (Redis)
#
# Deploys the whole backend stack on Render with one click:
#   Dashboard -> New -> Blueprint -> pick this repo -> Render reads render.yaml
#
# The frontend deploys separately on Vercel (see vercel.json + docs/DEPLOY.md).
# Secrets marked `sync: false` are prompted once at blueprint sync time —
# paste the values from .env.local / your secrets manager there.
#
# NOTE: Render's free Postgres plan expires after 30 days and free web
# services spin down after ~15 min idle (cold start on next request).
# Use paid plans (starter) for a real launch.

services:
  - type: web
    name: cheque-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @cheque/api... build
    startCommand: node api/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production

      # --- Datastores (wired automatically by the blueprint) ---
      - key: DATABASE_URL
        fromDatabase:
          name: cheque-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cheque-redis
          property: connectionString

      # --- App secrets (auto-generated once, stable across redeploys) ---
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SALT
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

      # --- Email (Resend) — required in production ---
      - key: EMAIL_API_KEY
        sync: false

      # --- CORS: the Vercel frontend URL (e.g. https://cheque.vercel.app) ---
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # --- Stellar testnet constants ---
      - key: STELLAR_NETWORK
        value: TESTNET
      - key: STELLAR_NETWORK_PASSPHRASE
        value: Test SDF Network ; September 2015
      - key: STELLAR_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_SOROBAN_RPC_URL
        value: https://soroban-testnet.stellar.org
      - key: USDC_ASSET_CODE
        value: USDC
      - key: USDC_ISSUER_ADDRESS
        value: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
      - key: USDC_SAC_CONTRACT_ID
        value: CBIELTK6YBZJU5UP2WWQEUCYKLPU6AUNZ2BQ4WWFEIE3USCIHMXQDAMA
      - key: CHEQUE_CONTRACT_ID
        value: CDEVYL76NJ4HCI5JC57W5WIKKZYL6WTQHQXRGNNOIWEF3OENWD7Z5H3O

      # --- Stellar account keys (paste at sync time) ---
      - key: CONTRACT_ADMIN_SECRET
        sync: false
      - key: CLAIM_AUTHORITY_PUBLIC
        sync: false
      - key: CLAIM_AUTHORITY_SECRET
        sync: false
      - key: GUARDIAN_SECRET
        sync: false
      - key: FUNDING_ACCOUNT_SECRET
        sync: false
      - key: SETTLEMENT_ACCOUNT_PUBLIC
        sync: false
      - key: SETTLEMENT_ACCOUNT_SECRET
        sync: false
      - key: FEE_SOURCE_PUBLIC
        sync: false
      - key: FEE_SOURCE_SECRET
        sync: false
      - key: CHANNEL_ACCOUNT_SECRETS
        sync: false


  # Redis-compatible Key Value (Valkey 8) — a SERVICE, not a database.
  # Internal-only (ipAllowList: []): reachable from cheque-api over Render's
  # private network; REDIS_URL is wired via fromService above.
  - type: keyvalue
    name: cheque-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction # required by BullMQ — never evict queue jobs

databases:
  - name: cheque-db
    databaseName: cheque_db
    user: cheque_user
    plan: free
    region: oregon
